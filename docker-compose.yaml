#Postgres Database
networks:
  quickdesk-network:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine
    container_name: quickdesk-postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quickdesk-network
volumes:
  postgres_data:
