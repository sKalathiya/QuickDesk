[project]
name = "quickdesk-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.159.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.4.0",
]
