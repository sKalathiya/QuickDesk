[project]
name = "quickdesk-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.32",
    "fastapi[standard]>=0.159.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.4.0",
]
